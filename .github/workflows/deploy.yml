name: Deploy to FTP

on:
  push:
    branches: [main]
  workflow_dispatch:   # manual run = full sync of every file

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ikonsmarts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy changed files
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          DIR="${FTP_DIR:-/public_html/}"; DIR="${DIR%/}"
          SKIP='^(\.github/|README\.md$|deploy\.sh$|\.deploy\.env$|\.gitignore$)'
          CMDS=cmds.lftp
          { echo "set ssl:verify-certificate no"; echo "set cmd:fail-exit yes"; } > "$CMDS"

          # Changed files since the previous push; otherwise (manual run / first push) everything.
          if [ "${GITHUB_EVENT_NAME}" = push ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-status --no-renames "$BEFORE" "$GITHUB_SHA" > changes.txt
          else
            git ls-files | sed 's/^/A\t/' > changes.txt
          fi

          while IFS=$'\t' read -r status file; do
            [[ "$file" =~ $SKIP ]] && continue
            if [ "$status" = D ]; then
              echo "rm -f \"$DIR/$file\"" >> "$CMDS"
            else
              echo "put -d \"$file\" -o \"$DIR/$file\"" >> "$CMDS"
            fi
          done < changes.txt

          echo "bye" >> "$CMDS"
          echo "--- Changes ---"; cat changes.txt
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -f "$CMDS"
